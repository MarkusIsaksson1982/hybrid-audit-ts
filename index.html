<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ad-audit-mini</title>
<style>
  :root { color-scheme: light dark; --bg: #0f1419; --fg: #e7ecf1; --muted: #9aa7b2; --card: #1a222b; --high: #e35d6a; --medium: #e0a44a; --low: #5bbf8a; --border: #2b3642; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  .lead { color: var(--muted); margin: 0 0 1.25rem; }
  .meta { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; color: var(--muted); font-size: 0.9rem; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
  .badge.high { background: color-mix(in srgb, var(--high) 25%, transparent); color: var(--high); }
  .badge.medium { background: color-mix(in srgb, var(--medium) 25%, transparent); color: var(--medium); }
  .badge.low { background: color-mix(in srgb, var(--low) 25%, transparent); color: var(--low); }
  .err { color: var(--high); }
</style>
</head>
<body>
<main>
  <h1>ad-audit-mini</h1>
  <p class="lead">Typed rule engine plus validated multi-provider LLM findings into one deduplicated action list, written in strict TypeScript.</p>
  <div class="meta" id="meta" aria-live="polite">Loading sample data…</div>
  <table>
    <thead>
      <tr><th scope="col">Entity</th><th scope="col">Action</th><th scope="col">Severity</th><th scope="col">Sources</th><th scope="col">Reasons</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script type="module">
import { evaluateRules } from './dist/src/rules.js';
import { jsonArrayAdapter, parseLlmFindings, dedupeActions } from './dist/src/actions.js';

const meta = document.getElementById('meta');
const rows = document.getElementById('rows');

try {
  const data = await fetch('./data/sample.json').then((r) => {
    if (!r.ok) throw new Error('sample.json ' + r.status);
    return r.json();
  });
  const ruleFindings = evaluateRules(data.campaigns || []);
  const dropped = [];
  const llmFindings = [];
  for (const out of data.llmOutputs || []) {
    const parsed = parseLlmFindings(out.text, jsonArrayAdapter(out.provider));
    llmFindings.push(...parsed.findings);
    dropped.push({ provider: out.provider, dropped: parsed.dropped });
  }
  const actions = dedupeActions([...ruleFindings, ...llmFindings]);
  meta.textContent =
    actions.length + ' actions after dedupe. Dropped LLM items: ' +
    dropped.map((d) => d.provider + '=' + d.dropped).join(', ');
  rows.replaceChildren(
    ...actions.map((a) => {
      const tr = document.createElement('tr');
      const sev = document.createElement('span');
      sev.className = 'badge ' + a.severity;
      sev.textContent = a.severity;
      const cells = [
        a.entityId,
        a.action,
        sev,
        (a.sources || []).join(', '),
        (a.reasons || []).join('; '),
      ];
      for (const c of cells) {
        const td = document.createElement('td');
        if (c instanceof HTMLElement) td.appendChild(c);
        else td.textContent = c;
        tr.appendChild(td);
      }
      return tr;
    }),
  );
} catch (e) {
  meta.className = 'meta err';
  meta.textContent = 'Failed to render: ' + (e && e.message ? e.message : String(e));
}
</script>
</body>
</html>
